<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jaul — live call</title>
<style>
  :root {
    --bg: #f1f0e9;
    --surface: #ffffff;
    --surface-2: #f8f7f2;
    --ink: #20241e;
    --ink-soft: #5b6157;
    --ink-faint: #8b9086;
    --accent: #2b6e63;
    --accent-soft: #dcebe6;
    --success: #3e7a45;
    --success-soft: #e1eee0;
    --danger: #9c4a3a;
    --danger-soft: #f3e4e0;
    --line: #d9dccf;
    --hospital: #5b5470;
    --knowledge: #8a8e82;
    --shadow: 0 1px 2px rgba(32, 36, 30, 0.06), 0 4px 16px rgba(32, 36, 30, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14160f;
      --surface: #1d201a;
      --surface-2: #191b15;
      --ink: #eceae2;
      --ink-soft: #b7bcae;
      --ink-faint: #767b6e;
      --accent: #74c3b1;
      --accent-soft: #223530;
      --success: #86c68a;
      --success-soft: #1e2f20;
      --danger: #e0937f;
      --danger-soft: #33231e;
      --line: #2d3026;
      --hospital: #b3a9d6;
      --knowledge: #9ea394;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.4);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 3vh 1.25rem 6vh;
  }

  .stage { width: 100%; max-width: 820px; }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 1.1rem;
    margin-bottom: 1.4rem;
  }
  .masthead-title {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: clamp(1.4rem, 2.4vw, 1.9rem);
    font-weight: 600;
    margin: 0;
  }
  .masthead-sub {
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin: 0.3rem 0 0;
  }
  .masthead-sub b { color: var(--hospital); font-weight: 600; }

  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 0.74rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 0.35rem 0.75rem;
    border-radius: 999px;
    white-space: nowrap;
    transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  }
  .status-chip::before {
    content: "";
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 999px;
    flex: none;
  }
  .status-chip.waiting {
    background: var(--surface-2);
    color: var(--ink-faint);
    border: 1px solid var(--line);
  }
  .status-chip.waiting::before { background: var(--ink-faint); }

  .status-chip.live {
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .status-chip.live::before {
    background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }

  .status-chip.deal_reached {
    background: var(--success-soft);
    color: var(--success);
    border: 1px solid color-mix(in srgb, var(--success) 40%, transparent);
  }
  .status-chip.deal_reached::before { background: var(--success); }

  .status-chip.dead_end {
    background: var(--danger-soft);
    color: var(--danger);
    border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
  }
  .status-chip.dead_end::before { background: var(--danger); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.75); }
  }

  .signal-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    min-height: 1.9rem;
    margin-bottom: 1.6rem;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 0.76rem;
  }
  .signal-row .empty { color: var(--ink-faint); font-style: italic; font-family: inherit; }
  .pill {
    padding: 0.18rem 0.6rem;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .signal-arrow { color: var(--ink-faint); }

  .spine { position: relative; padding-left: 2.1rem; min-height: 6rem; }
  .spine::before {
    content: "";
    position: absolute;
    left: 0.86rem;
    top: 1.1rem;
    bottom: 1.4rem;
    width: 2px;
    background: linear-gradient(to bottom, var(--accent), var(--accent) 85%, transparent);
    opacity: 0.35;
  }

  .placeholder {
    padding-left: 0;
    margin-left: -2.1rem;
    color: var(--ink-faint);
    font-size: 0.9rem;
  }

  .turn { margin-top: 1.1rem; }
  .turn:first-child { margin-top: 0; }

  .bubble {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 0.85rem 1.05rem;
    margin-bottom: 0.55rem;
    opacity: 0;
    transform: translateY(6px);
    animation: rise 0.42s ease forwards;
  }
  .bubble::before {
    content: "";
    position: absolute;
    left: -1.64rem;
    top: 1.05rem;
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 999px;
    background: var(--surface);
    border: 2.5px solid var(--accent);
  }
  .bubble.rep::before { border-color: var(--ink-faint); }
  .bubble.outcome-deal::before { border-color: var(--success); background: var(--success); }
  .bubble.outcome-dead::before { border-color: var(--danger); background: var(--danger); }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .speaker {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-right: 0.55rem;
  }
  .bubble.agent .speaker { color: var(--accent); }
  .line-text {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .bubble.rep .line-text { color: var(--ink-soft); font-style: italic; }

  .bubble.outcome-deal, .bubble.outcome-dead {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 0.82rem;
    letter-spacing: 0.02em;
  }
  .bubble.outcome-deal { color: var(--success); background: var(--success-soft); border-color: color-mix(in srgb, var(--success) 35%, transparent); }
  .bubble.outcome-dead { color: var(--danger); background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }

  .conn-note {
    position: fixed;
    bottom: 1rem;
    right: 1.2rem;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 0.68rem;
    color: var(--ink-faint);
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="masthead">
      <div>
        <p class="masthead-title" id="title">jaul — waiting for a call</p>
        <p class="masthead-sub" id="subtitle">Nothing in progress yet.</p>
      </div>
      <span class="status-chip waiting" id="statusChip">idle</span>
    </div>

    <div class="signal-row" id="signalRow">
      <span class="empty">no classification yet</span>
    </div>

    <div class="spine" id="spine">
      <p class="placeholder" id="placeholder">The transcript will appear here turn by turn as the call happens.</p>
    </div>
  </div>

  <div class="conn-note" id="connNote">connecting…</div>

<script>
(function () {
  const titleEl = document.getElementById("title");
  const subtitleEl = document.getElementById("subtitle");
  const chipEl = document.getElementById("statusChip");
  const signalEl = document.getElementById("signalRow");
  const spineEl = document.getElementById("spine");
  const placeholderEl = document.getElementById("placeholder");
  const connEl = document.getElementById("connNote");

  let renderedCount = 0;
  let lastCallSid = null;

  function reset() {
    renderedCount = 0;
    spineEl.innerHTML = "";
    spineEl.appendChild(placeholderEl);
  }

  function classify(line) {
    if (line.startsWith("AGENT: ")) return { role: "agent", text: line.slice(7) };
    if (line.startsWith("REP: ")) return { role: "rep", text: line.slice(5) };
    if (line.startsWith("OUTCOME: ")) return { role: "outcome", text: line.slice(9) };
    return { role: "agent", text: line };
  }

  function appendLine(line, finalStatus) {
    if (placeholderEl.parentNode) placeholderEl.remove();
    const { role, text } = classify(line);
    const wrap = document.createElement("div");
    wrap.className = "turn";
    const bubble = document.createElement("div");

    if (role === "outcome") {
      bubble.className = "bubble " + (finalStatus === "deal_reached" ? "outcome-deal" : "outcome-dead");
      bubble.textContent = (finalStatus === "deal_reached" ? "✓ " : "✕ ") + text;
    } else {
      bubble.className = "bubble " + role;
      const speaker = document.createElement("span");
      speaker.className = "speaker";
      speaker.textContent = role === "agent" ? "Agent" : "Rep";
      const textEl = document.createElement("span");
      textEl.className = "line-text";
      textEl.textContent = text;
      bubble.appendChild(speaker);
      bubble.appendChild(textEl);
    }
    wrap.appendChild(bubble);
    spineEl.appendChild(wrap);
  }

  function renderSignal(data) {
    signalEl.innerHTML = "";
    if (!data.last_intent) {
      const span = document.createElement("span");
      span.className = "empty";
      span.textContent = "no classification yet";
      signalEl.appendChild(span);
      return;
    }
    const intentPill = document.createElement("span");
    intentPill.className = "pill";
    intentPill.textContent = data.last_intent;
    signalEl.appendChild(intentPill);
    if (data.last_move) {
      const arrow = document.createElement("span");
      arrow.className = "signal-arrow";
      arrow.textContent = "→";
      const movePill = document.createElement("span");
      movePill.className = "pill";
      movePill.textContent = data.last_move;
      signalEl.appendChild(arrow);
      signalEl.appendChild(movePill);
    }
  }

  async function poll() {
    try {
      const res = await fetch("/status", { cache: "no-store" });
      const data = await res.json();
      connEl.textContent = "live";

      if (!data.active && !data.transcript) {
        titleEl.textContent = "jaul — waiting for a call";
        subtitleEl.textContent = "Nothing in progress yet.";
        chipEl.className = "status-chip waiting";
        chipEl.textContent = "idle";
        return;
      }

      if (data.call_sid && data.call_sid !== lastCallSid) {
        reset();
        lastCallSid = data.call_sid;
      }

      titleEl.textContent = "jaul — " + (data.hospital || "unknown hospital");
      subtitleEl.innerHTML = "Calling on behalf of <b>" + (data.patient || "the patient") + "</b>";

      chipEl.className = "status-chip " + (data.status === "in_progress" ? "live" : data.status);
      chipEl.textContent = data.status === "in_progress" ? "live" : data.status.replace("_", " ");

      renderSignal(data);

      const transcript = data.transcript || [];
      for (let i = renderedCount; i < transcript.length; i++) {
        appendLine(transcript[i], data.status);
      }
      renderedCount = transcript.length;
    } catch (err) {
      connEl.textContent = "reconnecting…";
    }
  }

  poll();
  setInterval(poll, 900);
})();
</script>
</body>
</html>
